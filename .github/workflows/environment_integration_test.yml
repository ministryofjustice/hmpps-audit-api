name: environment_integration_test.yml

on:
  workflow_call:
    inputs:
      env_test_url:
        required: true
        type: string
      job_name:
        required: true
        type: string
      environment:
        required: true
        type: string
      audit_event_type:
        required: true
        type: string
    secrets:
      OAUTH_CLIENT_ID:
        required: true
      OAUTH_CLIENT_SECRET:
        required: true
      OAUTH_TOKEN_URL:
        required: true

permissions:
  contents: read

jobs:
  run-integration-test:
    name: ${{ inputs.job_name }}
    environment: ${{ inputs.environment }}
    runs-on: [self-hosted, hmpps-github-actions-runner]
    env:
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
      OAUTH_TOKEN_URL: ${{ secrets.OAUTH_TOKEN_URL }}
      ENV_TEST_URL: ${{ inputs.env_test_url }}
      AUDIT_EVENT_TYPE: ${{ inputs.audit_event_type }}
    steps:
      - name: Get OAuth token
        id: get_token
        shell: bash
        run: |
          BASIC_AUTH=$(echo -n "$OAUTH_CLIENT_ID:$OAUTH_CLIENT_SECRET" | base64 | tr -d '\n')
          RESPONSE=$(curl -sS --fail-with-body -X POST "$OAUTH_TOKEN_URL?grant_type=client_credentials" \
            -H "Content-Type: application/json" \
            -H "Authorization: Basic $BASIC_AUTH") || {
            echo "::error::OAuth token request failed. Response body:"
            echo "$RESPONSE" | jq . 2>/dev/null || echo "$RESPONSE"
            exit 1
          }
          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to extract access token."
            echo "Response was: $RESPONSE"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Step 1 - Generate consolidation test events
        id: generate_events
        env:
          TOKEN: ${{ steps.get_token.outputs.token }}
        run: |
          RESPONSE=$(curl -sS --fail-with-body \
            -X POST "$ENV_TEST_URL/internal/dev-testing/consolidation/$AUDIT_EVENT_TYPE/test-events" \
            -H "Authorization: Bearer $TOKEN") || {
            echo "::error::Generate consolidation test events request failed. Response body:"
            echo "$RESPONSE" | jq . 2>/dev/null || echo "$RESPONSE"
            exit 1
          }

          echo "Generate consolidation test events response:"
          echo "$RESPONSE" | jq .
          echo "$RESPONSE" > consolidation_test_events.json

          RUN_ID=$(jq -r '.runId' consolidation_test_events.json)
          TEST_DATE=$(jq -r '.date' consolidation_test_events.json)
          NUMBER_OF_EVENTS=$(jq '.events | length' consolidation_test_events.json)
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ] || [ -z "$TEST_DATE" ] || [ "$TEST_DATE" = "null" ] || [ "$NUMBER_OF_EVENTS" -eq 0 ]; then
            echo "::error::Generate consolidation test events response is missing runId, date or events."
            exit 1
          fi
          echo "Generated $NUMBER_OF_EVENTS $AUDIT_EVENT_TYPE consolidation test events for $TEST_DATE (run $RUN_ID)"
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "test_date=$TEST_DATE" >> $GITHUB_OUTPUT

      - name: Step 2 - Trigger consolidation for the test date
        env:
          TOKEN: ${{ steps.get_token.outputs.token }}
          RUN_ID: ${{ steps.generate_events.outputs.run_id }}
          TEST_DATE: ${{ steps.generate_events.outputs.test_date }}
        run: |
          RESPONSE=$(curl -sS --fail-with-body -w "\nHTTP status: %{http_code}" \
            -X POST "$ENV_TEST_URL/internal/dev-testing/consolidation/$AUDIT_EVENT_TYPE/consolidations" \
            -H "Content-Type: application/json" \
            --data "{\"runId\": \"$RUN_ID\", \"date\": \"$TEST_DATE\"}" \
            -H "Authorization: Bearer $TOKEN") || {
            echo "::error::Trigger consolidation request failed. Response body:"
            echo "$RESPONSE"
            exit 1
          }

          echo "$RESPONSE"
          echo "Consolidation of $AUDIT_EVENT_TYPE audit events for $TEST_DATE accepted"

      - name: Wait for consolidation job to complete
        run: sleep 5
