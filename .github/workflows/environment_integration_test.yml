name: environment_integration_test.yml

on:
  workflow_call:
    inputs:
      env_test_url:
        required: true
        type: string
      job_name:
        required: true
        type: string
      environment:
        required: true
        type: string
      audit_event_type:
        required: true
        type: string
    secrets:
      OAUTH_CLIENT_ID:
        required: true
      OAUTH_CLIENT_SECRET:
        required: true
      OAUTH_TOKEN_URL:
        required: true

permissions:
  contents: read

jobs:
  run-integration-test:
    name: ${{ inputs.job_name }}
    environment: ${{ inputs.environment }}
    runs-on: [self-hosted, hmpps-github-actions-runner]
    env:
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
      OAUTH_TOKEN_URL: ${{ secrets.OAUTH_TOKEN_URL }}
      ENV_TEST_URL: ${{ inputs.env_test_url }}
      AUDIT_EVENT_TYPE: ${{ inputs.audit_event_type }}
    steps:
      - name: Get OAuth token
        id: get_token
        shell: bash
        run: |
          BASIC_AUTH=$(echo -n "$OAUTH_CLIENT_ID:$OAUTH_CLIENT_SECRET" | base64 | tr -d '\n')
          RESPONSE=$(curl -sS --fail-with-body -X POST "$OAUTH_TOKEN_URL?grant_type=client_credentials" \
            -H "Content-Type: application/json" \
            -H "Authorization: Basic $BASIC_AUTH") || {
            echo "::error::OAuth token request failed. Response body:"
            echo "$RESPONSE" | jq . 2>/dev/null || echo "$RESPONSE"
            exit 1
          }
          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to extract access token."
            echo "Response was: $RESPONSE"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Step 1 - Create audit event and register partition
        id: create_event
        run: |
          RESPONSE=$(curl -sS --fail-with-body \
            -X POST "$ENV_TEST_URL/internal/integration-test/audit-event/$AUDIT_EVENT_TYPE" \
            -H "Authorization: Bearer ${{ steps.get_token.outputs.token }}" \
            -H "Content-Type: application/json") || {
            echo "::error::Create audit event request failed. Response body:"
            echo "$RESPONSE" | jq . 2>/dev/null || echo "$RESPONSE"
            exit 1
          }

          echo "Audit event response: $RESPONSE"
          echo "$RESPONSE" > audit_event.json

      - name: Step 2 - Query Athena and assert audit event exists
        env:
          TOKEN: ${{ steps.get_token.outputs.token }}
        run: |
          WHO=$(jq -r '.who' audit_event.json)
          echo "Using 'who' value for query: $WHO"

          # S3 write and Athena partition registration happen asynchronously after the event is consumed,
          # so retry the whole query/assert cycle a few times before failing.
          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            sleep 10
            echo "::group::Attempt $attempt of $MAX_ATTEMPTS"

            RESPONSE=$(curl -sS --fail-with-body \
              -X POST "$ENV_TEST_URL/internal/integration-test/query/$AUDIT_EVENT_TYPE/$WHO" \
              -H "Authorization: Bearer $TOKEN") || {
              echo "::error::Trigger audit query request failed. Response body:"
              echo "$RESPONSE" | jq . 2>/dev/null || echo "$RESPONSE"
              exit 1
            }
            QUERY_ID=$(echo "$RESPONSE" | jq -r '.queryExecutionId')
            echo "Triggered audit query: $QUERY_ID"

            QUERY_STATE=""
            for poll in {1..36}; do
              RESPONSE=$(curl -sS --fail-with-body \
                "$ENV_TEST_URL/internal/integration-test/query/$AUDIT_EVENT_TYPE/$QUERY_ID" \
                -H "Authorization: Bearer $TOKEN") || {
                echo "::error::Poll audit query request failed. Response body:"
                echo "$RESPONSE" | jq . 2>/dev/null || echo "$RESPONSE"
                exit 1
              }
              QUERY_STATE=$(echo "$RESPONSE" | jq -r '.queryState')
              if [[ "$QUERY_STATE" == "SUCCEEDED" ]]; then
                break
              elif [[ "$QUERY_STATE" == "FAILED" || "$QUERY_STATE" == "CANCELLED" ]]; then
                echo "::error::Audit query finished with state $QUERY_STATE. Response body:"
                echo "$RESPONSE" | jq . 2>/dev/null || echo "$RESPONSE"
                exit 1
              fi
              sleep 5
            done
            if [[ "$QUERY_STATE" != "SUCCEEDED" ]]; then
              echo "::error::Timed out waiting for audit query $QUERY_ID to succeed after 3 minutes."
              exit 1
            fi
            echo "Audit query $QUERY_ID succeeded."

            if RESPONSE=$(curl -sS --fail-with-body \
              -X POST "$ENV_TEST_URL/internal/integration-test/assertion/$QUERY_ID" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              --data @audit_event.json); then
              echo "::endgroup::"
              echo "Assertion passed on attempt $attempt:"
              echo "$RESPONSE" | jq . 2>/dev/null || echo "$RESPONSE"
              exit 0
            fi

            echo "Assertion failed on attempt $attempt. Response body:"
            echo "$RESPONSE" | jq . 2>/dev/null || echo "$RESPONSE"
            echo "::endgroup::"
          done

          echo "::error::Audit event not found in Athena after $MAX_ATTEMPTS attempts. Last response body:"
          echo "$RESPONSE" | jq . 2>/dev/null || echo "$RESPONSE"
          exit 1
